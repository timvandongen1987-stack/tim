<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PrinterPro Orderscherm · Rust</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: smaakkiezer bovenin, daaronder het orderscherm in de gekozen smaak (overzicht of opdracht).
   Tokens uit de webshop: pink, ink, paper, line, green, rose, radius 24 · Space Grotesk + Inter.
   Bewust één lichte wereld (zoals de webshop); smaak 4 is bewust donker. */
:root{
  --pink:#fc0075; --pink-d:#d10062; --pink-soft:#ffe3f0; --rose:#fff0f6;
  --ink:#231f20; --muted:#6a6d70; --paper:#f5f5f5; --hero:#e9eaec; --line:#e1e3e5; --white:#ffffff; --sel:#f0f1f2;
  --green:#2c6651; --green-bg:#e4f1ea; --amber:#8a5300; --amber-bg:#fff1d6; --blue:#27468f; --blue-bg:#e8eefb;
  --red:#b3261e; --red-bg:#fde9e8; --warn-bg:#fff7cf; --warn:#6b5300;
  --display:'Space Grotesk',Arial,sans-serif; --body:Inter,Arial,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:24px; --r-m:16px; --r-s:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Smaakkiezer ---------- */
.picker{background:var(--ink);color:#fff;padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.picker-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;max-width:1600px;margin:0 auto}
.picker h1{font-family:var(--display);font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--pink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12px;color:var(--pink);background:#fff;flex-shrink:0}
.picker h1 small{font-weight:400;color:#b9b3b5;font-size:13px;font-family:var(--body)}
.flavors{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.flavors button{color:#d8d3d5;padding:8px 14px;border-radius:999px;font-weight:500;font-size:13px;display:flex;gap:8px;align-items:center}
.flavors button b{font-family:var(--display);font-weight:600;color:#8e888a}
.flavors button:hover{background:#3a3536;color:#fff}
.flavors button[aria-pressed=true]{background:var(--pink);color:#fff}
.flavors button[aria-pressed=true] b{color:#fff}
.screens{display:flex;gap:4px;background:#3a3536;border-radius:999px;padding:3px}
.screens button{color:#d8d3d5;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:500}
.screens button[aria-pressed=true]{background:#fff;color:var(--ink)}
.pitch{max-width:1600px;margin:12px auto 0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:8px 32px;padding-bottom:14px;border-top:1px solid #3a3536;padding-top:12px}
.pitch h2{margin:0;font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.02em}
.pitch p{margin:2px 0 0;color:#cfc9cb;max-width:60ch}
.pitch ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 20px}
.pitch li{color:#cfc9cb;font-size:12.5px;padding-left:14px;position:relative}
.pitch li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--pink)}
.pitch li b{color:#fff;font-weight:600;display:block}
@media (max-width:860px){.pitch{grid-template-columns:1fr}.pitch ul{grid-template-columns:1fr}.flavors{margin-left:0}}

/* ---------- App shell ---------- */
#app{background:var(--paper);color:var(--ink);min-height:70vh}
.stage{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.frame{max-width:1600px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0 16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand .logo{width:38px;height:38px;font-size:14px}
.brand span small{display:block;font-family:var(--body);font-weight:500;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.gsearch{flex:1;min-width:220px;max-width:560px;display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:10px 18px;color:var(--muted)}
.gsearch input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink)}
.userlinks{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.userlinks b{color:var(--ink)}
.userlinks a{text-decoration:none;border-bottom:1px solid var(--line)}
.crumbs{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--pink)}
.crumbs b{color:var(--ink);font-weight:600}
.body{display:grid;grid-template-columns:76px minmax(0,1fr);gap:20px}
.rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:12px;align-self:start}
.rail a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;text-decoration:none;font-size:11px;color:var(--ink)}
.rail a svg{width:20px;height:20px}
.rail a.on{background:#4a4546;color:#fff}
.rail a:hover:not(.on){background:var(--hero)}
@media (max-width:760px){.body{grid-template-columns:1fr}.rail{flex-direction:row;position:static}.rail a{flex:1}}

/* ---------- Basiscomponenten ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;font-weight:500;font-size:13px;white-space:nowrap;border:1px solid transparent;line-height:1.2}
.btn-p{background:var(--pink);color:#fff}
.btn-p:hover{background:var(--pink-d)}
.btn-s{background:var(--white);border-color:var(--line);color:var(--ink)}
.btn-s:hover{border-color:var(--ink)}
.btn-d{color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,transparent);background:var(--white)}
.btn-d:hover{background:var(--red-bg)}
.btn-g{color:var(--ink);padding:7px 10px}
.btn-g:hover{background:var(--hero)}
.btn-sm{padding:6px 11px;font-size:12px}
.link{color:var(--pink-d);text-decoration:none;font-weight:500;cursor:pointer}
.link:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ph-prep{background:var(--amber-bg);color:var(--amber)}
.ph-hold{background:var(--red-bg);color:var(--red)}
.ph-ready{background:var(--pink-soft);color:var(--pink-d)}
.ph-prod{background:var(--blue-bg);color:var(--blue)}
.ph-done{background:var(--green-bg);color:var(--green)}
.ph-closed{background:var(--hero);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:11.5px;background:var(--hero);color:var(--ink);white-space:nowrap}
.tag.flag{background:var(--rose);color:var(--pink-d);font-weight:600}
.tag.blanco{background:var(--ink);color:var(--white)}
.dl{display:inline-flex;flex-direction:column;line-height:1.25}
.dl b{font-weight:600}
.dl small{color:var(--muted);font-size:11.5px}
.dl.d0 b{color:var(--red)}
.dl.d1 b{color:var(--amber)}
.muted{color:var(--muted)}
.empty-dash{color:var(--muted)}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r)}
.inp,.sel,textarea.inp{width:100%;background:var(--white);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 11px;min-height:36px;color:var(--ink);outline:0}
.inp:focus,.sel:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--pink-soft)}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.inp[readonly]{background:var(--paper)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld .hint{font-size:11.5px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.inp,.row>.sel{flex:1;min-width:90px}
.fgrid{display:grid;gap:14px 16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.fgrid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fgrid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.fgrid.c2,.fgrid.c3,.fgrid.c4{grid-template-columns:1fr}}
.span2{grid-column:span 2}
.full{grid-column:1/-1}
@media (max-width:700px){.span2{grid-column:auto}}
@media (max-width:820px){.afdgrid{grid-template-columns:1fr!important}}
.mini{display:inline-flex;gap:2px}
.row:has(.mini){flex-wrap:nowrap}
.fld>label.chk{text-transform:none;letter-spacing:0;font-size:13px;font-weight:400;color:var(--ink)}
.mini button{width:24px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.mini button:hover{background:var(--hero);color:var(--ink)}
.quick{font-size:11.5px;color:var(--pink-d);font-weight:500;white-space:nowrap;cursor:pointer}
.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer;padding:5px 0;font-size:13px}
.chk input{accent-color:var(--pink);width:16px;height:16px;margin:1px 0 0;flex-shrink:0}
.note-auto{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:8px}
.alert{display:flex;gap:10px;align-items:center;background:var(--warn-bg);color:var(--warn);border:1px solid #f1e08a;border-radius:var(--r-m);padding:11px 16px;font-weight:600;font-size:13px}
.alert svg{color:#b58900;width:18px;height:18px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--white);position:sticky;top:0}
table.t td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:hover td{background:var(--sel)}
table.t tr.picked td{background:var(--rose)}
table.t td.id a{font-family:var(--mono);font-weight:600;color:var(--pink-d);text-decoration:none;cursor:pointer}
.contact b{display:block;font-weight:600}
.contact span{display:block;color:var(--muted);font-size:12px}
.acts{display:flex;gap:2px}
.acts button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.acts button:hover{background:var(--hero);color:var(--ink)}
.emptyrow{padding:22px;text-align:center;color:var(--muted);font-size:12.5px}
.secnum{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* rich text */
.rte{border:1px solid var(--line);border-radius:var(--r-s);background:var(--white);overflow:hidden;display:flex;flex-direction:column}
.rte-bar{display:flex;gap:2px;flex-wrap:wrap;padding:5px 6px;border-bottom:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:12px}
.rte-bar span{padding:3px 7px;border-radius:6px}
.rte-bar span:hover{background:var(--hero);color:var(--ink)}
.rte-bar i{width:1px;background:var(--line);margin:3px 4px}
.rte-area{min-height:90px;padding:10px 12px;outline:0}
.rte-area:empty::before{content:attr(data-ph);color:var(--muted)}
.hist{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding:8px 12px;display:flex;justify-content:space-between;gap:8px}

/* prioriteiten: chips per groep */
.pgroups{display:flex;flex-direction:column;gap:12px}
.pgroup h4{margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.pgroup h4 em{font-style:normal;font-weight:500;letter-spacing:0;text-transform:none;background:var(--pink);color:#fff;border-radius:999px;padding:0 7px;font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:5px 11px;font-size:12px;text-align:left;line-height:1.3;display:inline-flex;gap:6px;align-items:center}
.chip code{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--white)}
.chip[aria-pressed=true] code{color:#c9c3c5}
.chip.alarm{border-color:#f3b5cf}
.chip.hide{display:none}
.pfilter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pfilter .inp{max-width:280px}
.selsum{font-size:12px;color:var(--muted)}
.selsum b{color:var(--ink)}

/* adres */
.addr{font-style:normal;line-height:1.6}
.addr b{font-weight:600}

/* lijstbalk */
.listbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lsearch{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 14px;flex:1;min-width:240px;max-width:520px}
.lsearch input{border:0;outline:0;background:transparent;flex:1;min-width:0;padding:5px 0}
.count{font-size:12px;color:var(--muted)}
.count b{color:var(--ink)}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.bulk .sel{width:auto;min-width:230px;min-height:32px;padding-block:5px}
.pager{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.pager button{min-width:32px;height:32px;border-radius:999px;padding:0 8px}
.pager button.on{background:var(--ink);color:var(--white)}
.pager button:hover:not(.on){background:var(--hero)}
.filters details{border-bottom:1px solid var(--line)}
.filters summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:11px 2px;font-weight:600;font-size:12.5px}
.filters summary::-webkit-details-marker{display:none}
.filters summary::after{content:"+";color:var(--muted);font-weight:400;font-size:16px}
.filters details[open] summary::after{content:"–"}
.filters summary small{font-weight:500;color:var(--pink-d);margin-left:auto;margin-right:10px}
.flist{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:1px;max-height:260px;overflow:auto}
.flist li a{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:8px;text-decoration:none;font-size:12.5px;cursor:pointer}
.flist li a:hover{background:var(--hero)}
.flist li a.on{background:var(--ink);color:var(--white)}
.flist li a span{color:var(--muted);font-variant-numeric:tabular-nums}
.flist li a.on span{color:#c9c3c5}
.daterange{display:flex;gap:6px;margin-bottom:10px}
.daterange .inp{min-height:32px;padding:5px 8px}

/* =========================================================
   SMAAK 1 · STUDIO — webshop 1-op-1: zachte kaarten, overzicht + vaste samenvatting
   ========================================================= */
.v1 .l-wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.v1 .fpanel{padding:8px 18px 14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.v1 .fpanel h3{font-family:var(--display);font-size:16px;margin:10px 0 4px;display:flex;justify-content:space-between;align-items:center}
.v1 .l-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.v1 .l-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.v1 .l-head h1{font-family:var(--display);font-size:34px;letter-spacing:-.03em;margin:0;line-height:1}
.v1 .l-head p{margin:6px 0 0;color:var(--muted)}
.v1 .quickviews{display:flex;gap:8px;flex-wrap:wrap}
.v1 .qv{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:7px 14px;font-size:12.5px;display:inline-flex;gap:8px;align-items:center}
.v1 .qv span{color:var(--muted);font-variant-numeric:tabular-nums}
.v1 .qv.on{background:var(--ink);color:var(--white);border-color:var(--ink)}
.v1 .qv.on span{color:#c9c3c5}
.v1 .tcard{overflow:hidden}
.v1 .tcard .tbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.v1 .tcard .tfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px}
@media (max-width:980px){.v1 .l-wrap{grid-template-columns:1fr}.v1 .fpanel{position:static;max-height:none}}

.v1 .d-wrap{display:grid;grid-template-columns:190px minmax(0,1fr) 320px;gap:20px;align-items:start}
.v1 .toc{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.v1 .toc .lbl{padding:0 10px 6px}
.v1 .toc a{padding:8px 12px;border-radius:12px;text-decoration:none;display:flex;justify-content:space-between;gap:6px}
.v1 .toc a:hover{background:var(--hero)}
.v1 .toc a.on{background:var(--white);font-weight:600;box-shadow:inset 3px 0 0 var(--pink)}
.v1 .toc a span{color:var(--muted);font-size:11.5px}
.v1 .d-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.v1 .sec{padding:22px 24px;scroll-margin-top:12px}
.v1 .sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.v1 .sec-h h2{font-family:var(--display);font-size:20px;margin:0;letter-spacing:-.015em}
.v1 .sec-h p{margin:0;color:var(--muted);font-size:12.5px}
.v1 .sub{font-family:var(--display);font-size:14px;font-weight:600;margin:20px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.v1 .side{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.v1 .sum{padding:20px}
.v1 .sum .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.v1 .sum h3{font-family:var(--display);font-size:26px;letter-spacing:-.02em;margin:2px 0 10px;line-height:1.05}
.v1 .sum dl{display:grid;grid-template-columns:auto 1fr;gap:9px 12px;margin:14px 0 0;font-size:12.5px}
.v1 .sum dt{color:var(--muted)}
.v1 .sum dd{margin:0;font-weight:500;text-align:right}
.v1 .count-dl{background:var(--rose);border-radius:var(--r-m);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.v1 .count-dl b{font-family:var(--display);font-size:22px;color:var(--pink-d)}
.v1 .actgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.v1 .actgrid .btn{justify-content:flex-start}
.v1 .savebox{padding:14px;display:flex;flex-direction:column;gap:8px}
.v1 .savebox .btn{justify-content:center}

    ${ds('Product','50 × Flyers · Mat · Houtvrij 250 g/m² · Dubbelzijdig · A5',B.lines(),true)}
    ${ds('Afdelingen','Productie | Klein formaat',B.afd())}
    ${ds('Prioriteiten',S.prio.size?S.prio.size+' geselecteerd':'Geen prioriteit',B.prio())}
    ${ds('Klant','suzanne · flyers cultuurbarbaren · 0644089603',B.contact())}
    ${ds('Notities','Geen notities',B.notes())}
    ${ds('Opdracht & proef','Website www.printerpro.nl · nabetaling — · proef —',`${B.meta()}<div class="fgrid c3">${fld('Status nabetaling',sel('v5nab',['---------','Nabetaling open','Nabetaling voldaan'],'---------'))}${fld('Verzending door',sel('v5vd',['---------',...DOOR],'---------'))}${fld('Blanco verzenden','<label class="chk"><input type="checkbox">Blanco verzenden</label>')}</div><div class="fgrid c2">${B.proef()}</div>`)}
    ${ds('Adressen','Rotterdamseweg 51, 2628 AJ Delft',`<div><span class="lbl">Factuuradres</span><div style="margin-top:6px">${B.factuur()}</div></div>${B.bezorgSum()}${B.bezorg()}${B.addDel()}`)}
    ${ds('Koeriers & Sendcloud','Focus · Sendcloud PostNL Standard · Fier',`<h4>Focus koeriers</h4>${B.focus()}<h4>Sendcloud</h4>${B.sendcloud()}<h4>Fier fietskoeriers</h4>${B.fier()}`)}
    ${ds('Taken & berichten','0 taken · 0 berichten',B.taken()+B.berichten())}
   </div>
   <div class="dr-f">${B.save()}</div></aside>`;
}

/* ---------------- Render & interactie ---------------- */
const VIEWS={1:[v1List,v1Detail],2:[v2List,v2Detail],3:[v3List,v3Detail],4:[v4List,v4Detail],5:[v5List,v5Detail]};
const app=document.getElementById('app');
function render(keepScroll){
  const y=window.scrollY;
  document.getElementById('flavors').innerHTML=FLAVORS.map((f,i)=>`<button aria-pressed="${S.v===i+1}" data-v="${i+1}"><b>${i+1}</b>${f.n}</button>`).join('');
  document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.screen===S.screen));
  const F=FLAVORS[S.v-1];
  document.getElementById('pitch').innerHTML=`<div><h2>${S.v} · ${F.n}</h2><p>${F.t} ${F.d}</p></div><ul>${F.p.map(([a,b])=>`<li><b>${a}</b>${b}</li>`).join('')}</ul>`;
  app.className='v'+S.v;
  app.innerHTML=VIEWS[S.v][S.screen==='list'?0:1]();
  if(!keepScroll)window.scrollTo(0,0);else window.scrollTo(0,y);
  save();
}
function syncPrio(){
  const n=S.prio.size;
  app.querySelectorAll('[data-psum]').forEach(e=>e.innerHTML=n?`<b>${n}</b> geselecteerd`:'Geen prioriteit geselecteerd');
  app.querySelectorAll('[data-psum2]').forEach(e=>e.textContent=n||'Geen');
  app.querySelectorAll('.pgroup').forEach(g=>{const c=g.querySelectorAll('.chip[aria-pressed=true]').length;const h=g.querySelector('h4');const em=h.querySelector('em');if(c){if(em)em.textContent=c;else h.insertAdjacentHTML('beforeend',`<em>${c}</em>`)}else if(em)em.remove()});
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-v],[data-screen],[data-open],[data-go],[data-chip],[data-qv],[data-tab],[data-kpi],[data-afdtab],[data-setst],a[href="#"],.pager button');
  if(!t)return;
  if(t.matches('a[href="#"]')){e.preventDefault();return}
  if(t.dataset.screen){S.screen=t.dataset.screen;render()}
  else if(t.dataset.open){if(e.target.closest('input,button:not([data-open]),.acts'))return;S.screen='detail';render()}
  else if(t.dataset.go){S.screen=t.dataset.go;render(S.v===5)}
  else if(t.dataset.chip){const p=t.dataset.chip;S.prio.has(p)?S.prio.delete(p):S.prio.add(p);t.setAttribute('aria-pressed',S.prio.has(p));syncPrio()}
  else if(t.dataset.qv){S.qv=t.dataset.qv;render(true)}
  else if(t.dataset.tab){S.tab=t.dataset.tab;render(true)}
  else if(t.dataset.kpi){const k=+t.dataset.kpi;S.kpi=S.kpi===k?null:k;render(true)}
  else if(t.dataset.afdtab){S.afdTab=t.dataset.afdtab;render(true)}
  else if(t.dataset.setst){S.st=t.dataset.setst;render(true)}
  else if(t.matches('.pager button')){t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t))}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.row){const id=+t.dataset.row;t.checked?S.sel.add(id):S.sel.delete(id);const tr=t.closest('tr,.r');if(tr)tr.classList.toggle('picked',t.checked);app.querySelectorAll('[data-selc]').forEach(x=>x.textContent=S.sel.size)}
  else if(t.dataset.prio){t.checked?S.prio.add(t.dataset.prio):S.prio.delete(t.dataset.prio);syncPrio()}
  else if(t.dataset.afd){t.checked?S.afd.add(t.dataset.afd):S.afd.delete(t.dataset.afd)}
  else if(t.hasAttribute('data-st')){S.st=t.value.slice(0,2);if(S.v===4)render(true)}
});
document.addEventListener('input',e=>{
  if(e.target.hasAttribute('data-pq')){const q=e.target.value.toLowerCase();const box=e.target.closest('.pfilter').nextElementSibling;
    box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('hide',!!q&&!c.dataset.chip.toLowerCase().includes(q)));
    box.querySelectorAll('.pgroup').forEach(g=>g.hidden=!g.querySelector('.chip:not(.hide)'))}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.v===5&&S.screen==='detail'){S.screen='list';render(true)}});
render();
</script>
